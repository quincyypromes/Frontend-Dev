<!DOCTYPE html>
<html>
<head>
    <title>Security Form</title>
</head>
<body>

    <form autocomplete="off">
        <input type="text" required placeholder="Username"><br><br>
        <input type="password" required placeholder="Password"><br><br>
        <input type="submit" value="Submit">
    </form>

    <p>Turning off autocomplete can improve security by preventing browsers from storing sensitive information.</p>

</body>
</html>
