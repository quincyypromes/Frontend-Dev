<!DOCTYPE html>
<html>
<head>
    <title>Google Map (Lazy Loading)</title>
</head>
<body>

    <!-- loading="lazy" delays map loading until near the viewport -->
    <iframe 
        title="My City Map"
        width="100%" 
        height="400"
        loading="lazy"
        src="https://www.google.com/maps/embed?...">
    </iframe>

</body>
</html>
