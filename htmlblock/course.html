<!DOCTYPE html>
<html>
<head>
    <title>Course Registration</title>
</head>
<body>

    <h1>Course Registration Form</h1>

    <!-- Grouped Fields -->
    <fieldset>
        <legend>Student Information</legend>

        <!-- Name Input -->
        <label>Name:</label>
        <input type="text"><br><br>

        <!-- Email Input -->
        <label>Email:</label>
        <input type="email"><br><br>

        <!-- Course Selection -->
        <label>Select Course:</label>
        <select>
            <option>Data Structures</option>
            <option>Web Development</option>
            <option>Machine Learning</option>
        </select>

    </fieldset>

    <br><br>

    <!-- Course Schedule Table -->
    <h2>Available Course Schedules</h2>

    <table border="1">
        <tr>
            <th>Day</th>
            <th>Time</th>
            <th>Instructor</th>
        </tr>
        <tr>
            <td>Monday</td>
            <td>10 AM</td>
            <td>Mr. Sharma</td>
        </tr>
        <tr>
            <td>Wednesday</td>
            <td>2 PM</td>
            <td>Ms. Gupta</td>
        </tr>
        <tr>
            <td>Friday</td>
            <td>4 PM</td>
            <td>Dr. Verma</td>
        </tr>
    </table>

</body>
</html>
